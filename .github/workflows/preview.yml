name: PR preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-preview:
    name: pr-preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - id: key
        env:
          DEPLOY_KEY: ${{ secrets.SCORETOOL_LAB_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to scoretool-lab
        id: publish
        if: steps.key.outputs.has == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SCORETOOL_LAB_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/preview_publish.sh
      - name: Comment the preview URL
        if: always() && (steps.key.outputs.has == 'false' || steps.publish.outcome == 'success')
        uses: actions/github-script@v7
        env:
          HAS_KEY: ${{ steps.key.outputs.has }}
          PUBLISHED: ${{ steps.publish.outcome }}
        with:
          script: |
            const marker = '<!-- scoretool-preview -->';
            const n = context.payload.pull_request.number;
            const url = `https://nfstride1-ux.github.io/scoretool-lab/pr/${n}/`;
            let body;
            if (process.env.HAS_KEY === 'true' && process.env.PUBLISHED === 'success') {
              body = [
                marker,
                `Preview for this pull request: ${url}`,
                '',
                `Phone app: ${url}?app=1`,
                `Lingkana home: ${url}#lk-home`,
                '',
                'GitHub Pages usually shows the folder within a minute of this check going green. This copy is not the live app. Personal scoresheets and sight-mark files are not copied into the preview.'
              ].join('\n');
            } else {
              body = [
                marker,
                'This pull request is ready to publish a preview, and the deploy key is not saved yet, so there is no URL.',
                '',
                'Nathe, to turn previews on:',
                '1. Open https://github.com/nfstride1-ux/scoretool-lab/settings/keys',
                '2. Add a deploy key with write access. Title it `scoretool-demo PR previews`.',
                '3. Open https://github.com/nfstride1-ux/scoretool-demo/settings/secrets/actions',
                '4. New repository secret. Name: `SCORETOOL_LAB_KEY`. Value: the private half of that key.',
                '5. Re-run the PR preview workflow. The comment will then show `https://nfstride1-ux.github.io/scoretool-lab/pr/' + n + '/`.',
                '',
                'The key is only for scoretool-lab. It does not go in the repo or in this comment.'
              ].join('\n');
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 100
            });
            const mine = comments.find(c => c.user && c.user.login === 'github-actions[bot]' && (c.body || '').includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
                body
              });
            }
